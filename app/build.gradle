plugins {
    id 'com.android.application'
}

android {
    // Use centralized properties from gradle.properties
    namespace findProperty('app.namespace') ?: 'com.sleepcompany.rfidapp'
    compileSdk  35

    defaultConfig {
        // Application ID (Package Name) from gradle.properties
        applicationId findProperty('app.packageName') ?: 'com.sleepcompany.rfidapp'

        // SDK versions from gradle.properties
        minSdk findProperty('app.minSdk') as Integer ?: 27
        targetSdk findProperty('app.targetSdk') as Integer ?: 34

        // Version information from gradle.properties
        versionCode findProperty('app.versionCode') as Integer ?: 1
        versionName findProperty('app.versionName') ?: '1.0'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true

        // Generate BuildConfig fields for runtime access
        buildConfigField "String", "PACKAGE_NAME", "\"${findProperty('app.packageName')}\""
        buildConfigField "String", "APP_NAMESPACE", "\"${findProperty('app.namespace')}\""
        buildConfigField "String", "APP_DISPLAY_NAME", "\"${findProperty('app.displayName')}\""

        // Generate string resources dynamically
        resValue "string", "app_name", findProperty('app.displayName') ?: 'RFID App'
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
        viewBinding true
        dataBinding true
    }

    // ✅ Added packaging options for better compatibility
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += '/META-INF/DEPENDENCIES'
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])

    // ✅ Local library files
    implementation files('libs/uhf.jar')
    implementation files('libs/scankey.jar')
    implementation files('libs/ScannerAPI.jar')

    // ✅ Material Design Components - Updated to latest stable
    implementation 'com.google.android.material:material:1.12.0'

    // ✅ AndroidX Core - Updated versions for API 35 compatibility
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'                    // Updated from 1.12.0
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.10.1'            // Now compatible with AGP 8.7.0+
    implementation 'androidx.activity:activity:1.10.1'                // Now compatible with AGP 8.7.0+
    implementation 'androidx.fragment:fragment-ktx:1.8.4'             // Updated from 1.6.2
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // ✅ Lifecycle - Updated to latest stable versions
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'    // Updated from 2.7.0
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6'  // Updated from 2.7.0
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.6'   // Updated from 2.7.0

    // ✅ Navigation - Updated to latest stable versions
    implementation 'androidx.navigation:navigation-fragment-ktx:2.8.2' // Updated from 2.7.6
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.2'       // Updated from 2.7.6
    implementation "androidx.gridlayout:gridlayout:1.0.0"
    // ✅ Retrofit networking - Updated to latest stable versions
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'            // Updated from 2.9.0
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'      // Updated from 2.9.0

    // ✅ OkHttp logging - Updated to latest stable version
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'   // Updated from 4.11.0

    // ✅ Testing dependencies - Updated to latest stable versions
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test:core:1.6.1'               // Updated from 1.5.0
    androidTestImplementation 'androidx.test:runner:1.6.2'             // Updated from 1.5.2
    androidTestImplementation 'androidx.test:rules:1.6.1'              // Updated from 1.5.0
}

configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"

        // ✅ Force compatible versions for API 35
        force 'androidx.activity:activity:1.10.1'
        force 'androidx.activity:activity-ktx:1.10.1'
        force 'androidx.core:core-ktx:1.13.1'
    }
}