// Top-level build.gradle

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // ✅ Android Gradle Plugin
        classpath "com.android.tools.build:gradle:8.5.2"

        // (Optional) Kotlin, if needed later
        // classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25"
    }
